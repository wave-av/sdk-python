[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-sdk"
version = "2.1.0"
description = "Official WAVE SDK for Python - 42 API modules for streaming, production, analytics, and more"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "WAVE Online, LLC", email = "sdk@wave.online"}
]
keywords = [
    "wave",
    "streaming",
    "video",
    "audio",
    "broadcast",
    "production",
    "ndi",
    "srt",
    "webrtc",
    "clips",
    "editor",
    "voice",
    "transcription",
    "captions",
    "analytics",
    "ai",
    "sdk",
    "prism",
    "fleet",
    "mesh"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    # pydantic 2.x needs this to resolve `str | None`-style PEP 604 unions on
    # Python 3.9, where `str | None` cannot be `eval()`'d natively (the SDK's
    # models use `from __future__ import annotations` + the new union syntax
    # for readability; requires-python allows 3.9, so this isn't optional).
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
realtime = [
    "websocket-client>=1.0.0",
]
x402 = [
    "eth-account>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://docs.wave.online/sdk/python"
Documentation = "https://docs.wave.online/sdk/python"
Repository = "https://github.com/wave-av/sdk-python"
Issues = "https://github.com/wave-av/sdk-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wave_sdk*"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# E501: line length is left to the formatter, not the linter.
# E701/E702: the SDK deliberately uses a compressed one-liner house style
# (multiple statements per line). Blessed by the maintainers.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Public re-exports: the package __init__ exists to re-export the API surface.
"wave_sdk/__init__.py" = ["F401"]
# Export-verification test imports every public symbol to assert it exists
# (checked via __all__ / hasattr), so the names are intentionally "unused".
"tests/test_sdk_exports.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
