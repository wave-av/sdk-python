name: release

# Codified release-on-tag pipeline for wave-sdk (PyPI: wave-sdk, PyPI Trusted
# Publishing, no stored token -- decision IGV-D-010: no per-repo publish
# secrets). Five jobs, each with its own minimal `permissions:`:
#
#   resolve-ref -- resolves + strictly validates the tag (push ref or
#              dispatch input) BEFORE it reaches any git/python/gh command as
#              text: format (v<semver>), existence (git rev-parse), and trust
#              (the tag's commit must be an ancestor of origin/main) -- every
#              later job checks out that commit BY SHA, not by the (mutable)
#              tag name. A workflow_dispatch `tag` input is
#              attacker-influencable text; requiring ancestry means every
#              downstream job only ever builds/publishes/releases code that
#              was already merged and reviewed on the default branch.
#   verify  -- checks out the resolved sha, asserts tag == pyproject.toml
#              version == wave_sdk.__version__ (fails loud on any mismatch),
#              installs, runs the full pytest suite, builds sdist+wheel,
#              and `twine check`s them. Nothing downstream runs on a red verify.
#   publish -- id-token: write only. Publishes via PyPI Trusted Publishing
#              (pypa/gh-action-pypi-publish, OIDC, NO API token) with PEP 740
#              attestations enabled. If PyPI already has this exact version
#              (checked live against pypi.org before publishing), the publish
#              step is skipped with a clear log line and the job still
#              succeeds -- a re-run must be idempotent, not a hard failure.
#   sbom    -- contents: read (no repo write -- only builds an artifact).
#              Downloads the ACTUAL PUBLISHED wheel from PyPI by
#              name==version (`pip download wave-sdk==<version>`, never a
#              hand-built files.pythonhosted.org URL), then INSTALLS that
#              exact wheel plus its resolved runtime-dependency closure into
#              an isolated `pip install --target` directory and generates
#              SPDX-JSON from that INSTALLED tree with anchore/sbom-action
#              (wraps syft, pinned to a full commit SHA). Scanning only the
#              bare, never-installed wheel produced a one-entry SBOM with
#              zero dependencies; the SBOM must enumerate what actually
#              ships. Fails loud if wave-sdk or any unconditional declared
#              runtime dependency is missing from the result. Uploads it as
#              a *workflow* artifact for `release` to pick up -- kept fully
#              separate from `publish`'s id-token: write.
#   release -- contents: write only. Creates/updates the GitHub Release for
#              the tag with the sdist+wheel AND the SBOM attached in the SAME
#              `gh release create`/`upload` call, so a Release is never
#              visible without its SBOM. Idempotent (--clobber re-upload).
#
# Triggers on `v*` tag pushes AND `workflow_dispatch` with a `tag` input, so
# an existing tag (e.g. the current v2.1.0, pushed before this workflow
# existed) can be backfilled on demand:
#   gh workflow run release.yml --repo wave-av/sdk-python --ref main -f tag=v2.1.0
#
# The `tag` dispatch input is optional (default "latest"): a blank input or
# the literal "latest" resolves to the most recent GitHub Release's tag, so
# an SBOM can be backfilled onto whatever already shipped (e.g. v2.2.0)
# without typing/guessing a tag name and without a new PyPI publish -- the
# `publish` job's existing PyPI-version-exists check already no-ops the
# publish step for a version PyPI already has, and `release`'s existing
# create-or-clobber-upload logic already handles a pre-existing release, so
# a full pipeline re-run against an already-released tag is a safe,
# idempotent SBOM-only backfill in practice:
#   gh workflow run release.yml --repo wave-av/sdk-python --ref main -f tag=v2.2.0
#
# Every `uses:` below is pinned to a 40-character commit SHA with the human
# version in a trailing comment -- a tag ref (`@v6`) is a mutable pointer an
# upstream maintainer (or an attacker who compromises their account) can
# repoint without your review ever seeing a new commit.
#
# One-time operator setup (this workflow cannot self-register): add this repo
# + workflow as a PyPI Trusted Publisher for the `wave-sdk` project. See the
# PR body for the exact pypi.org settings path.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to verify/publish/release/SBOM, e.g. v2.1.0 (backfill an
          existing tag). Leave blank or "latest" to resolve the most recent
          GitHub Release's tag -- e.g. to backfill an SBOM onto an
          already-published release without a new PyPI publish.
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Resolve + strictly validate the tag before it reaches any command. A
  # dispatch input is attacker-influencable text; a full-anchored regex (not a
  # glob) refuses anything that isn't exactly `v<semver>`. Beyond format, this
  # job also proves the tag's commit EXISTS and is an ANCESTOR of origin/main
  # before any downstream job checks it out. Outputs both `tag` (the name, for
  # assert_version.py/gh release) and `sha` (the validated commit, used for
  # every downstream checkout) -- never interpolated into a shell body, only
  # passed via env:/outputs.
  # ---------------------------------------------------------------------------
  resolve-ref:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Full history + all tags -- needed so `git rev-parse`/`git merge-base`
      # below can see the tag and `origin/main`. No `ref:` override: this
      # checks out whatever triggered the run (the pushed tag, or the branch a
      # dispatch was run from) -- never the untrusted dispatch input -- and no
      # step here executes anything from that tree (metadata reads only).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the tag to release
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Branch on the EVENT, not on whether DISPATCH_TAG happens to be
          # set -- a tag push's ambient github.ref_name is the pushed tag
          # (always correct to use as-is), but a workflow_dispatch's
          # github.ref_name is the branch it was run from (e.g. "main"),
          # which must NEVER be treated as a candidate release tag.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG:-latest}"

            # A blank dispatch input, or the literal sentinel "latest",
            # resolves to the most recent GitHub Release's tag -- lets an
            # operator backfill an SBOM onto whatever already shipped
            # without typing/guessing the tag name. `gh release view`
            # (no arg) returns the release GitHub itself marks "Latest";
            # contents: read is sufficient to read releases on this repo.
            if [[ -z "$TAG" || "$TAG" == "latest" ]]; then
              RESOLVED="$(gh release view --json tagName --jq .tagName)"
              if [[ -z "$RESOLVED" ]]; then
                echo "::error::could not resolve 'latest' -- no GitHub Release found in this repository"
                exit 1
              fi
              echo "resolved dispatch tag 'latest' -> $RESOLVED"
              TAG="$RESOLVED"
            fi
          else
            TAG="$PUSH_TAG"
          fi

          # 1. Format -- full-anchored regex, not a glob -- refuses anything
          #    that isn't exactly `v<semver>`. This value flows into a `ref:`
          #    on downstream checkout steps (as the resolved sha, never the
          #    tag text itself), so it is validated BEFORE use.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::refusing to process ref '$TAG' — expected v<semver>"
            exit 1
          fi

          # 2. Existence -- the tag must resolve to a real commit object in
          #    THIS repo, not just text that happens to look right.
          if ! SHA="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::tag '$TAG' does not exist in this repository (or does not point at a commit)"
            exit 1
          fi

          # 3. Trust -- a `workflow_dispatch` input is attacker-influencable
          #    text, and a dispatch run's ambient GITHUB_REF/Actions-cache
          #    scope is whatever branch it was dispatched on (normally
          #    `main`), even though the CODE this workflow goes on to execute
          #    (pytest, build, twine, PyPI publish) is the resolved tag's
          #    tree. Format-validity alone does not prove that tree was ever
          #    reviewed -- a tag pushed off an arbitrary/unmerged branch
          #    passes the regex above just as easily. Requiring the tag's
          #    commit to be an ANCESTOR of origin/main means every later job
          #    only ever runs code that was already merged (and reviewed) on
          #    the default branch -- never a bespoke, unmerged payload
          #    smuggled in via a crafted tag.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag '$TAG' (commit $SHA) is not reachable from origin/main — refusing to build/publish/release an unmerged or unrecognized ref"
            exit 1
          fi

          echo "resolved tag: $TAG -> $SHA (verified: v<semver> shape, exists, ancestor of origin/main)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (version match, tests, build)
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      # Release TOOLING is pinned to the WORKFLOW's own ref (github.sha --
      # always a commit on main this run executes from), never to the tag
      # being verified. A tag can predate any scripts/release/* helper this
      # workflow relies on (that is exactly how the v2.1.0 backfill failed --
      # scripts/release/assert_version.py did not exist yet at that tag), so
      # the helpers are checked out into their own path, separate from the
      # tag's tree, and invoked from there. The package/code under test stays
      # pinned to the tag's resolved (and ancestry-verified) sha above --
      # only the tooling that INSPECTS that tree floats to main.
      - name: Check out release tooling from the workflow's own ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: .release-tooling

      - name: Derive version from the resolved tag
        id: version
        env:
          TAG: ${{ needs.resolve-ref.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the SDK with every extra its tests need
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,realtime,x402]"
          pip install build twine

      - name: Assert tag == pyproject.toml version == wave_sdk.__version__
        run: python3 .release-tooling/scripts/release/assert_version.py "${{ needs.resolve-ref.outputs.tag }}"

      - name: pytest (full suite, the checked-out tag)
        run: python -m pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ needs.resolve-ref.outputs.tag }}
          path: dist/
          retention-days: 14

  publish:
    name: publish to PyPI
    needs: [resolve-ref, verify]
    # Ref floor for the one job that mints a publishing credential.
    # `resolve-ref` proves the TAG is v<semver>, exists, and is an ancestor of
    # origin/main -- so the CODE published is always merged code. It says
    # nothing about the RUN's own ref, which is what lands in the OIDC token's
    # `ref` claim and scopes this run's Actions cache: a dispatch from an
    # arbitrary branch would still reach PyPI under that branch's identity.
    # So: a v* tag push, a published release, or a dispatch from the default
    # branch (the documented backfill path, already ancestry-anchored) -- and
    # nothing else. A missing `default_branch` makes `format(...)` yield
    # `refs/heads/`, matching no real ref, so the guard fails CLOSED.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'release'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named environment on the publish job ONLY. It anchors two things this
    # workflow cannot grant itself: the `environment:pypi` claim the
    # registry-side trusted publisher is pinned to, and an environment
    # protection rule (required reviewer + tag-only deployment policy) gating
    # the mint. Configuring that environment is an operator act, not this file.
    environment:
      name: pypi
      url: https://pypi.org/project/wave-sdk/
    # `id-token: write` lives here and NOWHERE else; the workflow-level default
    # stays `contents: read`. Do not hoist this to the workflow level.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      # See the matching step in the `verify` job above: release tooling is
      # pinned to the workflow's own ref (github.sha), never to the tag being
      # published, so a backfilled tag from before scripts/release/* existed
      # still finds the helper it needs.
      - name: Check out release tooling from the workflow's own ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: .release-tooling

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.resolve-ref.outputs.tag }}
          path: dist

      - name: Check whether PyPI already has this exact version
        id: pypi_check
        run: |
          set -e
          RESULT=$(python3 .release-tooling/scripts/release/pypi_version_exists.py "${{ needs.verify.outputs.version }}")
          echo "exists=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI (Trusted Publishing, OIDC, PEP 740 attestations)
        if: steps.pypi_check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true

      - name: Skip publish (already on PyPI)
        if: steps.pypi_check.outputs.exists == 'true'
        run: echo "::notice::wave-sdk ${{ needs.verify.outputs.version }} is already on PyPI -- skipping publish, proceeding to release job"

  # ---------------------------------------------------------------------------
  # SUPPLY-001. Every published release carries an SBOM asset -- generated
  # here as a build artifact, then attached by `release` (below) in the SAME
  # `gh release create`/`upload` call as dist/*, so a Release is never
  # visible without its SBOM (no window where the Release exists but the
  # SBOM doesn't).
  #
  # Provenance: downloads the ACTUAL PUBLISHED wheel from PyPI by
  # name==version (never a hand-built files.pythonhosted.org URL;
  # --only-binary=:all: so a missing wheel fails loud instead of silently
  # SBOM-ing the sdist) rather than reusing `verify`'s locally built dist/
  # artifact: a rebuild is not guaranteed byte-identical to what PyPI
  # actually serves, and the SBOM must describe what ships, not what was
  # built pre-publish.
  #
  # Install-before-scan (defect fix): syft used to scan the directory holding
  # that bare, never-installed wheel, so the SBOM had one entry and zero
  # runtime dependencies -- and "packages[] is non-empty" waved it through.
  # Now the wheel is INSTALLED (deps resolved from PyPI) into an isolated
  # `pip install --target` tree, syft scans THAT, and validate_sbom.py fails
  # loud unless wave-sdk and every unconditional Requires-Dist are present.
  # ---------------------------------------------------------------------------
  sbom:
    name: generate SBOM
    needs: [resolve-ref, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # only reads PyPI + writes a local build artifact -- no repo write
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download the published wheel from PyPI (by name==version, never a hand-built URL)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sbom-src
          python -m pip install --upgrade pip

          # PyPI's CDN can lag a few seconds behind a Trusted-Publishing
          # upload -- retry rather than fail on that race. --only-binary
          # forces a hard failure instead of silently falling back to an
          # sdist if no compatible wheel is found.
          ok=false
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download "wave-sdk==${VERSION}" --no-deps --only-binary=:all: -d sbom-src; then
              ok=true
              break
            fi
            echo "pip download attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::error::could not download a wave-sdk==${VERSION} wheel from PyPI after 6 attempts"
            exit 1
          fi
          ls -la sbom-src

      - name: Install the published wheel + its runtime dependencies into an isolated target tree
        run: |
          set -euo pipefail
          # Exactly one wheel must have been downloaded above -- refuse to guess otherwise.
          # (Without nullglob an unmatched pattern stays literal; the -f test catches that.)
          WHEELS=(sbom-src/*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ] || [ ! -f "${WHEELS[0]}" ]; then
            echo "::error::expected exactly one .whl in sbom-src, found: ${WHEELS[*]}"
            exit 1
          fi
          mkdir -p sbom-env
          # Install the exact downloaded wheel FILE (not `wave-sdk==VERSION` again), so
          # the bytes syft describes are the ones `pip download` fetched and listed above.
          #   --target: a plain directory -- no venv bootstrap packages (pip/setuptools)
          #             and no runner site-packages leak into the inventory.
          #   --only-binary=:all:: dependencies must come as wheels; a dependency that
          #             would need an sdist build (arbitrary setup.py execution) fails
          #             loud here instead of running build scripts in the release job.
          python -m pip install --no-cache-dir --only-binary=:all: --target sbom-env "${WHEELS[0]}"
          echo "installed distributions:"
          for d in sbom-env/*.dist-info; do basename "$d"; done

      - name: Generate SPDX-JSON SBOM for the installed tree (published wheel + resolved runtime dependencies)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: sbom-env
          format: spdx-json
          output-file: wave_sdk-${{ needs.verify.outputs.version }}.spdx.json

      # See the matching step in `verify`/`publish`: release tooling is pinned
      # to the workflow's own ref (github.sha), never to the tag being
      # released, so a backfilled tag from before this script existed still
      # finds it. The validator itself lives in scripts/release/ (unit-tested
      # in tests/test_release_scripts.py) rather than inlined here.
      - name: Check out release tooling from the workflow's own ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: .release-tooling

      # Fail loud unless wave-sdk AND every unconditional runtime dependency
      # from the installed wheel's own Requires-Dist appear in packages[] with
      # a real version. The old "packages[] is non-empty" check passed on the
      # single self-describing entry the uninstalled scan produced.
      - name: Validate the SBOM enumerates wave-sdk and every declared runtime dependency
        env:
          FILE: wave_sdk-${{ needs.verify.outputs.version }}.spdx.json
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 .release-tooling/scripts/release/validate_sbom.py "$FILE" --target sbom-env --version "$VERSION"

      - name: Upload SBOM as a workflow artifact (for the release job to attach)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ needs.resolve-ref.outputs.tag }}
          path: wave_sdk-${{ needs.verify.outputs.version }}.spdx.json
          retention-days: 14

  release:
    name: create GitHub Release
    needs: [resolve-ref, publish, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create/upload the Release for this tag -- nothing else
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.resolve-ref.outputs.tag }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ needs.resolve-ref.outputs.tag }}
          path: sbom

      - name: Create or update the GitHub Release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-ref.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(dist/* sbom/*)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::no dist/ or sbom/ files to attach to the release"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists -- uploading dist+SBOM assets (clobber) instead of creating"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "wave-sdk $TAG" \
              --generate-notes
          fi
